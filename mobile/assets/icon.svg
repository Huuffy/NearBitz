<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- White background with rounded corners (iOS style) -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="#ffffff"/>

  <!-- Map pin centered -->
  <g transform="translate(512, 490)">
    <!-- Teardrop body -->
    <path d="M0 -260 C-144 -260 -260 -144 -260 0 C-260 144 0 310 0 310 C0 310 260 144 260 0 C260 -144 144 -260 0 -260 Z"
          fill="#4285f4"/>
    <!-- Inner white ring -->
    <circle cx="0" cy="-10" r="110" fill="#ffffff"/>
    <!-- Inner dot -->
    <circle cx="0" cy="-10" r="52" fill="#4285f4"/>
  </g>

  <!-- ".ai" subtle text at bottom -->
  <text x="512" y="940"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="88"
        font-weight="700"
        fill="#1a2744"
        text-anchor="middle"
        letter-spacing="2">GeoSales.ai</text>
</svg>
